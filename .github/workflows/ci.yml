name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify package versions without a release tag
        run: node scripts/verify-release.mjs package

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package Windows installer without publishing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $channel = if ($version -match '-rc\.') { 'rc' } else { 'latest' }
          npm run package:win -- --config.publish.channel=$channel --config.generateUpdatesFilesForAllChannels=false

      - name: Verify Windows candidate artifacts
        if: runner.os == 'Windows'
        run: node scripts/verify-release.mjs candidate

      - name: Record Windows candidate source and checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unable to determine build source.' }
          [ordered]@{
            commit = $commit
            version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            releaseTag = $null
            status = 'PR/CI test build, not an exact-tag release; signing not verified'
          } | ConvertTo-Json | Set-Content release/provenance.json
          Get-ChildItem release -File | Where-Object { $_.Extension -in @('.exe', '.blockmap', '.yml', '.json') } | ForEach-Object {
            if ($_.Length -eq 0) { throw "Empty build artifact: $($_.Name)" }
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt

      - name: Upload downloadable Windows test build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-build
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/provenance.json
            release/SHA256SUMS.txt
          if-no-files-found: error
