name: Dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --json > audit.json || true

      - name: Audit production dependencies
        run: npm audit --omit=dev --json > audit-prod.json || true

      - name: Report audit findings
        run: |
          node scripts/audit-report.mjs audit.json "All dependencies"
          node scripts/audit-report.mjs audit-prod.json "Production dependencies"

      - name: Upload audit reports
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-reports
          path: |
            audit.json
            audit-prod.json
          retention-days: 30
