name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing merged version tag (for example v1.1.2-rc.1); never a branch'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag input
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-rc\.\d+)?$') {
            throw 'Use an exact vX.Y.Z or vX.Y.Z-rc.N tag.'
          }

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify exact merged tag
        shell: pwsh
        run: |
          node scripts/verify-release.mjs tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Tag verification failed.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release source must already be merged into main.' }

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify release-tool formatting and generated shortcuts
        shell: pwsh
        run: |
          npx prettier --check .github/workflows/ci.yml .github/workflows/release.yml scripts/verify-release.mjs src/test/release-validation.test.ts docs/updater.md package.json package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          npm run docs:shortcuts
          if ($LASTEXITCODE -ne 0) { throw 'Shortcut generation failed.' }
          git diff --exit-code -- docs/keyboard-shortcuts.md
          if ($LASTEXITCODE -ne 0) { throw 'Generated shortcuts are stale.' }

      - name: Require signing credentials for stable releases
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:CSC_LINK) {
            "FORCE_SIGNING=true" >> $env:GITHUB_ENV
          } else {
            "FORCE_SIGNING=false" >> $env:GITHUB_ENV
          }
          $channel = if ($env:RELEASE_TAG -match '-rc\.') { 'rc' } else { 'latest' }
          "UPDATE_CHANNEL=$channel" >> $env:GITHUB_ENV

      - name: Build and package without publishing
        run: npm run package:win -- --config.forceCodeSigning=${{ env.FORCE_SIGNING }} --config.generateUpdatesFilesForAllChannels=false --config.publish.channel=${{ env.UPDATE_CHANNEL }}
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $paths = @(
            "release/A11y-Notebook-Setup-$version.exe",
            "release/A11y-Notebook-Portable-$version.exe",
            'release/win-unpacked/A11y Notebook.exe'
          )
          $signatures = foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($env:FORCE_SIGNING -eq 'true' -and $signature.Status -ne 'Valid') {
              throw "Signature verification failed: $path ($($signature.Status))"
            }
            if ($env:FORCE_SIGNING -eq 'false' -and $signature.Status -ne 'NotSigned') {
              throw "Unexpected signature status: $path ($($signature.Status))"
            }
            [ordered]@{
              file = $path
              status = "$($signature.Status)"
              subject = $signature.SignerCertificate.Subject
              thumbprint = $signature.SignerCertificate.Thumbprint
            }
          }
          ConvertTo-Json -InputObject @($signatures) | Set-Content release/signatures.json
          if ($env:FORCE_SIGNING -eq 'true') {
            $updateConfig = Get-Content 'release/win-unpacked/resources/app-update.yml' -Raw
            if ($updateConfig -notmatch '(?m)^publisherName:') {
              throw 'Signed app must retain publisher verification in its updater configuration.'
            }
          }

      - name: Verify artifacts and record provenance
        run: node scripts/verify-release.mjs artifacts "${{ env.RELEASE_TAG }}"

      - name: Windows desktop UI Automation smoke
        id: uia
        continue-on-error: true
        run: npm run test:ui-smoke

      - name: Installed upgrade smoke (not updater E2E)
        id: upgrade
        continue-on-error: true
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/windows-installed-upgrade.ps1 -CandidateInstallerPath "release/A11y-Notebook-Setup-$version.exe" -CandidateVersion $version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record desktop validation outcomes
        shell: pwsh
        env:
          UIA_OUTCOME: ${{ steps.uia.outcome }}
          UPGRADE_OUTCOME: ${{ steps.upgrade.outcome }}
        run: |
          $uiAutomation = if ([string]::IsNullOrWhiteSpace($env:UIA_OUTCOME)) { 'not run' } else { $env:UIA_OUTCOME }
          $installerOverInstall = if ([string]::IsNullOrWhiteSpace($env:UPGRADE_OUTCOME)) { 'not run' } else { $env:UPGRADE_OUTCOME }
          $failedChecks = @(
            if ($uiAutomation -cne 'success') { [ordered]@{ name = 'Windows desktop UI Automation'; outcome = $uiAutomation } }
            if ($installerOverInstall -cne 'success') { [ordered]@{ name = 'Installed upgrade smoke'; outcome = $installerOverInstall } }
          )
          $isRc = $env:RELEASE_TAG -match '-rc\.'
          $warning = $null
          if ($failedChecks.Count -gt 0) {
            $failedNames = ($failedChecks | ForEach-Object { "$($_.name) ($($_.outcome))" }) -join ', '
            if ($isRc) {
              $warning = "WARNING: Desktop checks did not pass ($failedNames). RC policy allows publication without passing these checks; they remain failed and require manual review."
            } else {
              $warning = "WARNING: Desktop checks did not pass ($failedNames). These checks require an interactive Windows desktop and cannot run on GitHub-hosted runners (session 0), so they do not block publication. They remain failed, are disclosed in the release notes, and must be run on a real Windows desktop before production promotion."
            }
          }
          [ordered]@{
            uiAutomation = $uiAutomation
            installerOverInstall = $installerOverInstall
            updaterEndToEnd = 'not exercised; stable clients do not opt into RC updates'
            failedChecks = @($failedChecks)
            warning = $warning
          } | ConvertTo-Json -Depth 5 | Set-Content release/desktop-validation.json
          "$((Get-FileHash release/desktop-validation.json -Algorithm SHA256).Hash.ToLower())  desktop-validation.json" | Add-Content release/SHA256SUMS.txt
          '## Windows desktop validation' >> $env:GITHUB_STEP_SUMMARY
          if ($warning) { ">$warning" >> $env:GITHUB_STEP_SUMMARY }
          '```json' >> $env:GITHUB_STEP_SUMMARY
          Get-Content release/desktop-validation.json >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Retain verified build even if publication fails
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ env.RELEASE_TAG }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/SHA256SUMS.txt
            release/provenance.json
            release/signatures.json
            release/desktop-validation.json
          if-no-files-found: error

      - name: Publish or update release only after validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rc = $env:RELEASE_TAG -match '-rc\.'
          $trust = if ($env:FORCE_SIGNING -eq 'true') { 'Signed (Authenticode verified)' } elseif ($rc) { 'UNSIGNED prerelease; Windows may display SmartScreen warnings' } else { 'UNSIGNED stable release; Windows may display SmartScreen warnings' }
          $desktopValidation = Get-Content release/desktop-validation.json -Raw | ConvertFrom-Json
          $desktopOutcomes = "Windows desktop UI Automation: $($desktopValidation.uiAutomation). Installer-over-install smoke: $($desktopValidation.installerOverInstall)."
          $desktopPolicy = if ($desktopValidation.failedChecks.Count -gt 0 -and $rc) {
            'WARNING: Desktop checks did not pass; RC policy allows publication for testing, and the failures remain recorded in desktop-validation.json.'
          } elseif ($desktopValidation.failedChecks.Count -gt 0) {
            'WARNING: Desktop checks did not pass. These checks require an interactive Windows desktop and cannot run on GitHub-hosted runners (session 0), so they do not block publication; they remain recorded in desktop-validation.json and must be run on a real Windows desktop before production promotion.'
          } else {
            'Both automated desktop checks passed.'
          }
          $notes = @"
          $trust.

          Stabilization: PDF annotation integration checks now separate cold engine/worker startup from tagged and natively rotated document checks, retaining document identity and verified-anchor assertions.

          Source tag: $env:RELEASE_TAG. Exact commit, run URL and SHA-256 checksums are attached.
          Passed checks: typecheck, lint, tests, build, packaging, update metadata/hash verification.
          $desktopOutcomes See desktop-validation.json and workflow logs. $desktopPolicy
          Installer-over-install is NOT full updater E2E. Signed builds must pass Authenticode verification; unsigned builds are published only when signing credentials are absent.
          Manual JAWS/NVDA/Narrator, forced-colors and Windows desktop checks remain for production promotion.
          "@
          $notes | Set-Content "$env:RUNNER_TEMP/release-notes.txt"
          $assets = @(Get-ChildItem release -File | Where-Object {
            ($_.Name -match '\.(exe|blockmap|yml)$' -and $_.Name -ne 'builder-debug.yml') -or $_.Name -in @('SHA256SUMS.txt', 'provenance.json', 'signatures.json', 'desktop-validation.json')
          } | ForEach-Object FullName)
          $options = if ($rc) { @('--prerelease', '--latest=false') } else { @('--prerelease=false', '--latest') }
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json url | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --title "A11y Notebook $env:RELEASE_TAG" --notes-file "$env:RUNNER_TEMP/release-notes.txt" --draft=false @options
            if ($LASTEXITCODE -ne 0) { throw 'Release metadata update failed.' }
          } else {
            gh release create "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "A11y Notebook $env:RELEASE_TAG" --notes-file "$env:RUNNER_TEMP/release-notes.txt" @options
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" @assets --clobber=false
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; never overwrite release assets.' }
          $release = gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,url | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -or $release.isPrerelease -ne $rc) { throw 'Published release state is incorrect.' }
          foreach ($path in $assets) {
            $file = Get-Item $path
            $asset = $release.assets | Where-Object name -eq $file.Name
            if (!$asset -or $asset.size -ne $file.Length) { throw "Published asset missing or wrong size: $($file.Name)" }
          }
          "Download: $($release.url)" >> $env:GITHUB_STEP_SUMMARY
