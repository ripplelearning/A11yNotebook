name: Release

# Publishes the Windows installer to a GitHub Release when a version tag is pushed.
# Installed copies of A11y Notebook find it through Help → Check for Updates.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION. Bump the version before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build and publish Windows installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Verify published release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $json = gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw "Could not read the published release." }
          $release = $json | ConvertFrom-Json
          if ($release.isDraft) { throw "Release is still a draft; the updater cannot discover it." }
          $required = @(
            "A11y-Notebook-Setup-$version.exe",
            "A11y-Notebook-Setup-$version.exe.blockmap",
            "A11y-Notebook-Portable-$version.exe",
            "latest.yml"
          )
          foreach ($name in $required) {
            $asset = $release.assets | Where-Object { $_.name -eq $name }
            if (!$asset -or $asset.size -le 0) { throw "Release asset missing or empty: $name" }
            Write-Host "Verified release asset: $name ($($asset.size) bytes)"
          }
