<!doctype html>
<html lang="en">
  <head>
    <title>Chrome tagged sample</title>
    <style>
      @page {
        margin: 2cm;
      }
    </style>
  </head>
  <body>
    <h1>Chrome Sample Heading</h1>
    <p>First paragraph of body text.</p>
    <ul>
      <li>Alpha item</li>
      <li>Beta item</li>
    </ul>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Ada</td>
          <td>10</td>
        </tr>
      </tbody>
    </table>
    <p>Link to <a href="https://example.com/">example site</a>.</p>
    <h2 style="page-break-before: always">Second Page Heading</h2>
    <p>More text.</p>
  </body>
</html>
