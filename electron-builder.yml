# electron-builder configuration for A11y Notebook.
# Build a Windows installer with:  npm run package:win   (output: release/)
appId: com.ripplelearning.a11ynotebook
productName: A11y Notebook
copyright: Copyright © 2026 ripplelearning

directories:
  output: release
  buildResources: build

beforePack: ./scripts/build-open-with.mjs

files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!**/*.map'

win:
  extraResources:
    - from: out/native/A11yNotebook.OpenWith.exe
      to: native/A11yNotebook.OpenWith.exe
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # Code signing: set CSC_LINK / CSC_KEY_PASSWORD (or WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD)
  # in the build environment. When the installer is signed, electron-updater verifies
  # that downloaded updates are signed by the same publisher. See docs/updater.md.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: A11y Notebook
  uninstallDisplayName: A11y Notebook
  artifactName: A11y-Notebook-Setup-${version}.${ext}

portable:
  artifactName: A11y-Notebook-Portable-${version}.${ext}

# macOS (unsigned first, per the Oct 27, 2026 decision): no Apple Developer
# signing/notarization yet, so Gatekeeper warns on first launch and users
# install via right-click → Open, and in-app updates do not run on Mac.
# When signing is set up, remove hardenedRuntime: false and
# gatekeeperAssess: false and let electron-builder sign + notarize.
# build/icon.icns is generated from build/icon.ico's 256px PNG (the
# largest source in the repo); the 512/1024 elements are upscales, so
# large icons render soft until a higher-resolution source exists.
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  artifactName: A11y-Notebook-${version}-${arch}.${ext}

publish:
  provider: github
  owner: ripplelearning
  repo: A11yNotebook
  # Publish as a full release (not a draft) so Help → Check for Updates can find it.
  releaseType: release
